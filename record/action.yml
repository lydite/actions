# Lands a run's coverage measurements as the baseline every later change is
# gated against.
#
# It assumes lydite is already on PATH — `lydite/actions/setup` puts it there.
#
# `lydite test --gate-coverage` writes nothing to the `lydite` branch. It reads
# a baseline, gates against it, and leaves what it would record in the report
# directory; this is the only thing that lands it, and it executes nothing from
# the repository — no suite, no `setup` or `teardown` command, no compose
# service.
#
# **Where this runs matters more than which command it runs.** Recording is a
# push, so this job holds `contents: write`. The split takes that token out of
# the job running a repository's own code; it does not make a branch's numbers
# trustworthy, because `record` verifies no number and a branch that can edit
# its own workflow and its own component declaration can make the measuring job
# emit whatever it likes. A poisoned baseline persists and gates every later
# change, where a poisoned verdict is one bad run. So this belongs on a tree
# that has already merged — `lydite/actions/.github/workflows/lydite-baseline.yml`
# is that shape — and pull requests gate read-only and record nothing.
#
# What it does verify is the tree. A candidate names the tree it was measured
# on and `record` refuses to land it anywhere else, which is the one integrity
# property available to a command that executes nothing: without it a mis-wired
# workflow lands one tree's numbers under another tree's key, silently. It
# re-checks completeness too, against the declaration read from the tree being
# recorded — a partial baseline is worse than none, since any non-empty entry
# reads as a cache hit and the missing component is then `new` on every later
# change.
#
# One write after the fold, never one per shard: N pushes racing one branch, and
# every shard's document is partial by construction, so each would be refused.
# `record` folds the report directories itself, because it runs in a job
# `lydite/actions/merge` does not precede.
#
# Quality history is per-branch, and the branch is an input rather than
# something read from the run. An entry lands under the branch it was measured
# on and gates every later change on that branch; `record` verifies no number,
# so it has nothing to infer that key from, and a default lands one branch's
# numbers under another branch's key — silently, which is the failure this
# action's tree check exists to rule out. The caller says which branch its run
# belongs to.
#
# It needs `fetch-depth: 0`: the baseline lives on a branch this reads and
# writes, and the tree the candidate names has to resolve.
name: lydite test record
description: Record a run's coverage measurements as the baseline on the lydite branch

inputs:
  dir:
    description: the scan root, relative to the workspace
    required: false
    default: "."
  reports:
    description: >
      directory holding one subdirectory per shard's uploaded reports, as
      `actions/download-artifact` with a `lydite-shard-*` pattern produces
    required: false
    default: shards
  branch:
    description: >
      the branch this baseline is being recorded for; a consumer calling this
      action directly must be explicit
    required: true

runs:
  using: composite
  steps:
    # The fold itself is shared; what is this action's is that the documents
    # are a measurement or a scan, that nothing here is published — so no
    # component subdirectory is copied and no artifact is uploaded — and the
    # branch the entry lands under.
    - uses: ./.github/actions/fold
      with:
        dir: ${{ inputs.dir }}
        reports: ${{ inputs.reports }}
        doc-names: measurements.json scan.json
        copy-components: "false"
        command: test record
        extra-args: --branch ${{ inputs.branch }}
        error-message: "no shard uploaded a measurements or scan document under ${{ inputs.reports }}; there is nothing to record"
        upload-reports: "false"
