# Runs lydite's scanners over a repository and uploads what they wrote.
#
# It assumes lydite is already on PATH — `lydite/actions/setup` puts it there —
# rather than installing one of its own, so a workflow running scan beside test
# installs once and both jobs agree on the version.
#
# `--diff-base auto` on a pull request is not an optimisation. Without a token
# Semgrep falls back to a whole-repository scan, which blocks a change on the
# repository's pre-existing findings — findings no token-bearing run ever
# reported, in code the change never touched. Resolving the merge-base scopes
# the fallback to what the change introduces, which is what `semgrep ci` would
# have done. It needs the history reaching that merge-base, so the caller's
# checkout has to be `fetch-depth: 0`.
name: lydite scan
description: Run lydite's SAST and SCA checks, and upload the reports

inputs:
  dir:
    description: the scan root, relative to the workspace
    required: false
    default: "."
  diff-base:
    description: >
      what to scope a token-less Semgrep run to. `auto` resolves the merge-base
      and is what a pull request wants; empty scans the whole repository, which
      is what a push to the default branch wants.
    required: false
    default: ""
  base-branch:
    description: >
      the branch a merge-base is resolved against. Pass `github.base_ref` on a
      pull request; empty lets lydite discover the default branch.
    required: false
    default: ""
  semgrep-token:
    description: >
      a Semgrep AppSec Platform token. With one, lydite runs `semgrep ci`,
      which is diff-aware on its own and uploads to the platform.
    required: false
    default: ""
  upload-reports:
    description: upload .lydite-reports as an artifact for a later `publish`
    required: false
    default: "true"
  artifact-name:
    description: which job's reports these are; becomes the artifact suffix
    required: false
    default: scan

runs:
  using: composite
  steps:
    # Every value reaches the script through env and is referenced as a shell
    # variable. Interpolating `${{ }}` into a run body is a script-injection
    # vector, and Semgrep's yaml.github-actions.security.run-shell-injection
    # rule has caught exactly that mistake in a lydite action before.
    - shell: bash
      env:
        DIR: ${{ inputs.dir }}
        DIFF_BASE: ${{ inputs.diff-base }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        SEMGREP_APP_TOKEN: ${{ inputs.semgrep-token }}
      run: |
        set -euo pipefail
        args=(scan --dir "${DIR}")
        if [ -n "${DIFF_BASE}" ]; then
          args+=(--diff-base "${DIFF_BASE}")
        fi
        if [ -n "${BASE_BRANCH}" ]; then
          args+=(--base-branch "${BASE_BRANCH}")
        fi
        lydite "${args[@]}"

    # A job whose lydite never started wrote no directory, and an upload of
    # nothing is a warning rather than a result. The upload never fails the
    # job either: the report is evidence about a verdict already reached and
    # printed, so losing it costs a section of a comment, and failing over
    # that turns a run red for a reason its author cannot act on.
    - id: reports
      if: ${{ always() && inputs.upload-reports == 'true' }}
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: |
        path="${DIR%/}/.lydite-reports"
        if [ -d "${path}" ]; then
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
        else
          echo "no ${path}: this job wrote no report" >&2
        fi

    - if: ${{ always() && steps.reports.outputs.path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lydite-reports-${{ inputs.artifact-name }}
        path: ${{ steps.reports.outputs.path }}
        retention-days: 7
        # The directory disowns itself with a .gitignore, and an artifact that
        # silently dropped it would be missing the file explaining why the
        # rest is not in git.
        include-hidden-files: true
