# ci-test — this file is yours.
#
# gt created it once and will never modify or delete it again.
#
# This repository ships composite actions, not a program, so "test" means:
# every action.yml still parses and still declares what a composite action is
# required to declare. That is a low bar, but it is the bar that catches the
# failure that actually happens here — a YAML edit that breaks every consumer's
# workflow at once, with no local build step to catch it first.
#
name: ci-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint itself is not fetched at run time: this action's `runs`
      # block uses a Docker image pinned by digest, with actionlint built
      # into that image at a fixed version, so the commit SHA above pins
      # both the image reference and the actionlint version together.
      - uses: reviewdog/action-actionlint@8b682e1e7e512151d73a6b9449cbff173846226e # v1.74.0
        with:
          reporter: local
          fail_level: error
          # The default filter_mode, "file", scopes findings to a diff, which
          # this reporter has none to compute (it prints to stdout rather than
          # a PR review) and fails outright for want of one. Every finding in
          # every workflow file matters here, changed or not.
          filter_mode: nofilter

      # actionlint reads the shell embedded in a `run:` block; it does not
      # follow a `bash <path>` invocation into the script that body names, and
      # the YAML validation below checks shape rather than shell. Without this
      # step the fold every shard-matrix action delegates to — the one place
      # word-splitting, a built-up `find` expression and `cp -R` live — is the
      # only shell in the repository nothing lints.
      - name: shellcheck action scripts
        run: |
          shopt -s globstar nullglob
          scripts=(.github/actions/**/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no .sh found under .github/actions — this check is testing nothing"
            exit 1
          fi
          printf 'shellcheck %s\n' "${scripts[@]}"
          shellcheck "${scripts[@]}"

      - name: validate composite actions
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          found = (
              glob.glob("*/action.yml") + glob.glob("*/action.yaml")
              + glob.glob(".github/actions/*/action.yml") + glob.glob(".github/actions/*/action.yaml")
          )
          if not found:
              sys.exit("no action.yml found — this check is testing nothing")

          bad = 0
          for f in found:
              try:
                  doc = yaml.safe_load(open(f))
              except Exception as e:
                  print(f"::error file={f}::not valid YAML: {e}"); bad += 1; continue
              for key in ("name", "description", "runs"):
                  if key not in doc:
                      print(f"::error file={f}::missing required key '{key}'"); bad += 1
              runs = doc.get("runs") or {}
              if runs.get("using") != "composite":
                  print(f"::error file={f}::runs.using must be 'composite', got {runs.get('using')!r}"); bad += 1
              for i, step in enumerate(runs.get("steps") or []):
                  if "run" in step and "shell" not in step:
                      print(f"::error file={f}::step {i} ('{step.get('name','?')}') has 'run' without 'shell'"); bad += 1
              print(f"ok  {f}  ({len(runs.get('steps') or [])} steps)")

          sys.exit(1 if bad else 0)
          PY
