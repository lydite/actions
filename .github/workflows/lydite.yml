# Everything lydite says about a pull request, as one workflow run.
#
# A consumer calls this and gets the referral, the scan, the gated suites, the
# mutants and one standing comment assembled from all four:
#
#   referral ──────────────────────┐   no needs, so the status lands in seconds
#   scan ──────────────────────────┤
#   plan ─┬─► test (matrix) ───────► merge
#         └─► mutation (matrix) ───► mutation-merge
#   mutation-declined ─────────────┤   instead of both, when mutation: false
#                                  └─► publish   needs all, if: always()
#
#   jobs:
#     lydite:
#       uses: lydite/actions/.github/workflows/lydite.yml@v1
#       permissions:
#         contents: read
#         statuses: write
#         id-token: write
#         pull-requests: write
#
# One run, and that is not a convenience. The comment is assembled from every
# job's reports, so they have to be artifacts of the same run: a publish
# triggered by another workflow's completion could not see the referral's
# report without either recomputing the verdict or looking a run up by head SHA
# and racing it.
#
# The referral has no `needs`, so its status lands within seconds of a push and
# a reader can start clearing it while the suites are still running (ADR 0015).
#
# The suites are sharded. `plan` groups the declared components into the sets
# that must run in one process — those publishing a host port in common, or
# rooted at overlapping directories — and each matrix job runs one of them. A
# shard reports exactly the components it was given and nothing about any
# other, so every declared component takes exactly one row across the matrix,
# and `merge` fails over a component with no row (a shard whose job died) or
# two (two jobs running the same work). The fold is also the only thing that
# can compute `coverage(repo)` and `patch(repo)`, since both sum every
# component's counts.
#
# The mutation matrix runs *beside* the test matrix and reuses `plan`'s output
# verbatim: a shard is the conflict closure over published host ports and
# overlapping directories, which is the same question whichever command
# consumes it. It does not run after — mutation and the coverage gate share a
# checkout and not a compilation, so a phase inside `test` would make each of
# those jobs serially longer by the most expensive thing lydite runs.
#
# `mutation: false` declines it, and declining is not the same as omitting it: a
# comment with no mutation section reads as a repository whose mutants all died.
# So `mutation-declined` runs instead of the matrix and its fold, and writes the
# one document that says so under the same artifact name the fold would have
# uploaded. It needs no `plan`, because `--declined` returns before a component
# is loaded, and it must not reach the fold, whose completeness check would read
# a document carrying no component row as every declared component's shard
# having died.
#
# Nothing records a coverage baseline here, and that is the design rather than
# an omission. Recording is a push to the `lydite` branch, and this workflow's
# jobs run a pull request's own suites and whatever `setup`/`teardown` shell its
# declaration carries. `lydite-baseline.yml` in this repository is the shape
# that records, after a change has merged.
#
# The actions are referenced at @v1 rather than by a relative path, because a
# relative `uses:` in a called workflow resolves against the caller's checkout,
# not this repository. A release moves v1 to the tagged commit, so this file
# and the actions it calls always ship together.
name: lydite

on:
  workflow_call:
    inputs:
      dir:
        description: the scan root, relative to the workspace
        type: string
        required: false
        default: "."
      lydite-version:
        description: which lydite release to run; `latest` resolves the newest
        type: string
        required: false
        default: latest
      gate-coverage:
        description: compare each component's coverage against its baseline
        type: boolean
        required: false
        default: true
      affected:
        description: run only the components this change could have broken
        type: boolean
        required: false
        default: true
      mutation:
        description: mutate this change; false says so in the comment rather than omitting the section
        type: boolean
        required: false
        default: true
      relay:
        description: >
          the comment relay's origin, so the comment arrives as lydite and no
          job holds a credential that can write. Empty posts as
          github-actions[bot], which is a supported path and not a stopgap.
        type: string
        required: false
        default: ""
    secrets:
      semgrep-token:
        description: >
          a Semgrep AppSec Platform token. With one, lydite runs `semgrep ci`,
          which is diff-aware on its own and uploads to the platform.
        required: false

# One verdict per revision. A superseded push is about to be re-decided, and
# two runs racing to write the same status and the same comment would leave
# whichever finished last standing rather than whichever is current.
concurrency:
  group: lydite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  referral:
    name: referral
    # Not on a merge-queue entry. `review` decides from a pull request's diff
    # and publishes against that pull request; a `merge_group` run has neither,
    # so it answers with the queue job below instead.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The verdict is the record a clearance acts on.
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The referral is computed from <merge-base>..HEAD, so the history
          # reaching that merge-base has to be present. A shallow checkout
          # resolves no merge-base and the run fails rather than deciding from
          # a diff that describes something else.
          fetch-depth: 0

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - uses: lydite/actions/review@v1
        with:
          dir: ${{ inputs.dir }}
          # Only on a pull request. This is the half that fixes a stacked
          # pull request, whose base is not the default branch.
          base-branch: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}

  queue:
    name: queue
    # A merge queue replays the change onto a fresh base, so the entry's commit
    # is a revision nobody has cleared, and a `gh-readonly-queue/` ref carries no
    # pull request for anyone to clear it at. Requiring `lydite/referral` and
    # enabling a queue were therefore mutually exclusive.
    #
    # lydite carries the clearance forward instead. This job recomputes the
    # decision against the queue's own tree and submits its fingerprint; the
    # relay resolves the originating pull request live, reads the clearance
    # standing on that pull request's own head, and writes `lydite/referral` at
    # the queue revision — `success` carrying the original clearer's attribution
    # when the reasons are unchanged, `pending` naming what differs when they are
    # not. Never `failure`, which is the isolation gate and would make the entry
    # permanently unclearable. ADR 0053 in lydite/lydite is the decision.
    #
    # No guard beyond the event. This job is the only publisher of
    # `lydite/referral` for a queue revision — a commit no earlier run ever
    # reported under — and a status that is never published is what stalls the
    # entry forever. A job that runs and fails says so; a job that does not run
    # is indistinguishable from one that passed.
    #
    # That is also why `relay` is not optional here. The comparison reads the
    # change's own diff, so this job must not hold a credential that can write a
    # status, which leaves the relay as its only route to one. With no relay
    # configured the command refuses, loudly, naming what is missing.
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Deliberately no `statuses: write`. Mints the Actions OIDC token the
      # relay authenticates; it is not a credential and grants nothing alone.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The decision is computed from <merge-base>..HEAD, as on a pull
          # request. A shallow checkout resolves no merge-base and the run fails
          # rather than deciding from a diff describing something else.
          fetch-depth: 0

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - name: carry the clearance forward
        shell: bash
        # Every value reaches the script as an environment variable. A `run:`
        # body is the one place text is spliced into something a shell executes,
        # so an expression is never interpolated into one.
        env:
          DIR: ${{ inputs.dir }}
          RELAY: ${{ inputs.relay }}
        run: |
          set -euo pipefail
          lydite clearance queue --dir "${DIR}" --relay "${RELAY}"

  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - uses: lydite/actions/scan@v1
        with:
          dir: ${{ inputs.dir }}
          # `auto` on a pull request only. It scopes Semgrep's token-less
          # fallback to what the change introduces; on a push to the default
          # branch a whole-repository scan is what is wanted.
          diff-base: ${{ github.event_name == 'pull_request' && 'auto' || '' }}
          base-branch: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          semgrep-token: ${{ secrets.semgrep-token }}

  # Pure: it reads `.lydite/components.yml` and each component's compose file,
  # and nothing else — no git, no network, no process. So it needs no history
  # and no container runtime, and it cannot narrow by `affected`, which needs a
  # merge-base. The shards narrow instead.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - uses: lydite/actions/plan@v1
        id: plan
        with:
          dir: ${{ inputs.dir }}

  test:
    name: test (${{ matrix.shard.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every failing shard, in one run. A cancelled sibling leaves its
      # components with no row at all, which `merge` reports as a shard that
      # died rather than as the failure that actually happened.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Read-only, deliberately. This job runs the repository's own suites and
    # any setup/teardown shell the declaration carries, which on a pull request
    # is the pull request's own code. Nothing it runs holds a token that can
    # write anywhere, and nothing it runs would use one: `lydite test` writes
    # nothing to the `lydite` branch, leaving its measurement as a candidate for
    # `lydite/actions/record` to land from a job that runs no repository code.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - uses: lydite/actions/test@v1
        with:
          dir: ${{ inputs.dir }}
          gate-coverage: ${{ inputs.gate-coverage }}
          # Never on a push to the default branch, where lydite runs every
          # component so that a missed `depends_on` edge is caught at merge.
          affected: ${{ inputs.affected && github.event_name == 'pull_request' }}
          component: ${{ matrix.shard.components }}
          base-branch: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          # Under its own prefix, so `publish` never reads a shard's document as
          # a `test` section of its own: there would be one per shard, each
          # answering about part of the repository under one heading.
          artifact-name: ${{ matrix.shard.name }}
          artifact-prefix: lydite-shard

  mutation:
    name: mutation (${{ matrix.shard.name }})
    needs: plan
    if: ${{ inputs.mutation }}
    runs-on: ubuntu-latest
    # Longer than the test matrix on purpose: a mutant is a suite run, and a
    # component's budget is its mutant count times its own suite. Nothing caps
    # that inside lydite, so a run genuinely too large dies here, the shard
    # uploads no document, and the fold below reports it as a shard that died.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Read-only, exactly as the test matrix is and for the same reason: this job
    # runs the pull request's own suites, once per mutant, plus any
    # setup/teardown shell the declaration carries. Mutation has no baseline to
    # record, so nothing here would use a token that can write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Mutation is diff-scoped always: mutants come from the change against
          # the merge-base, and a shallow checkout resolves no merge-base.
          # lydite refuses rather than mutating the repository.
          fetch-depth: 0

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - uses: lydite/actions/mutation@v1
        with:
          dir: ${{ inputs.dir }}
          # Never on a push to the default branch, where the merge-base is HEAD
          # itself and the flag only obscures the intent.
          affected: ${{ inputs.affected && github.event_name == 'pull_request' }}
          component: ${{ matrix.shard.components }}
          base-branch: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          # Under its own prefix, so `publish` never reads a shard's document as
          # a `mutation` section of its own: there would be one per shard, each
          # answering about part of the repository under one heading.
          artifact-name: ${{ matrix.shard.name }}
          artifact-prefix: lydite-mutation-shard

  # The declined half of the input, and the whole of what it does is write the
  # document saying so. No `needs`, no history and no container runtime:
  # `--declined` returns before a component is loaded, so there is no shard plan
  # to wait for and nothing to diff against a merge-base. The artifact is named
  # exactly as `mutation-merge`'s fold names its own, so `publish` reads either
  # run through the same `lydite-reports-*` pattern.
  mutation-declined:
    name: mutation declined
    if: ${{ !inputs.mutation }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      # Every value reaches the shell through env. Interpolating `${{ }}` into a
      # run body is a script-injection vector.
      - id: reports
        shell: bash
        env:
          DIR: ${{ inputs.dir }}
        run: |
          set -euo pipefail
          lydite mutation --declined --dir "${DIR}"
          echo "path=${DIR%/}/.lydite-reports" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lydite-reports-mutation
          path: ${{ steps.reports.outputs.path }}
          retention-days: 7
          include-hidden-files: true

  merge:
    name: merge
    needs: [plan, test]
    # Whatever the shards did. A shard that failed is exactly the run whose fold
    # a reader wants, and a shard that died is what the fold exists to report
    # rather than to inherit as silence.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lydite-shard-*
          path: shards

      - uses: lydite/actions/merge@v1
        with:
          dir: ${{ inputs.dir }}
          reports: shards

  # The completeness check, and nothing else: a declared component with no row
  # in any shard is a shard whose job died, which an `unmeasured` row would let
  # publish as a passing verdict over a repository half of which was never
  # mutated. There is no repository-wide mutation figure to compute, since
  # survived == 0 for every component is survived == 0 for the repository.
  mutation-merge:
    name: mutation merge
    needs: [plan, mutation]
    # Whatever the shards did. A shard that failed is exactly the run whose fold
    # a reader wants, and a shard that died is what the fold exists to report
    # rather than to inherit as silence. A declined run has no shards at all,
    # and folding none of them would report every declared component as dead.
    if: ${{ always() && inputs.mutation }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lydite-mutation-shard-*
          path: mutation-shards

      - uses: lydite/actions/mutation-merge@v1
        with:
          dir: ${{ inputs.dir }}
          reports: mutation-shards

  publish:
    name: publish
    needs: [referral, scan, merge, mutation-merge, mutation-declined]
    # Runs whatever the others did. A comment that only appears when everything
    # passed is a comment nobody needs: the run that failed is the one whose
    # reader wants to know why.
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Mints the Actions OIDC token the relay authenticates. It is not a
      # credential and grants nothing by itself.
      id-token: write
      # The fallback path only, for a repository the app is not installed on.
      pull-requests: write
    steps:
      - uses: lydite/actions/setup@v1
        with:
          version: ${{ inputs.lydite-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lydite-reports-*
          path: reports

      - uses: lydite/actions/publish@v1
        with:
          reports: reports
          pull-request: ${{ github.event.pull_request.number }}
          base: ${{ github.event.pull_request.base.sha }}
          relay: ${{ inputs.relay }}
