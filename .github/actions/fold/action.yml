# The fold every shard-matrix action performs, in one place.
#
# Private to this repository: it is reached only through a relative
# `uses: ./.github/actions/fold`, and is not one of the per-command actions a
# consumer names. What varies between the callers is which documents identify a
# shard's report directory, which lydite subcommand reads them, and whether the
# folded reports go on to a comment; the finding, the reporting and the exit
# status do not, and a second copy of them is a second place for the shapes
# below to be got wrong.
#
# It assumes lydite is already on PATH — `lydite/actions/setup` puts it there.
name: lydite fold
description: Find every shard's report directory and fold it with a lydite command

inputs:
  dir:
    description: the scan root, relative to the workspace
    required: false
    default: "."
  reports:
    description: >
      directory holding one subdirectory per shard's uploaded reports, as
      `actions/download-artifact` with a `lydite-shard-*` pattern produces
    required: false
    default: shards
  doc-names:
    description: >
      space-separated document filenames whose presence marks a report
      directory, e.g. `measurements.json test.json`
    required: true
  copy-components:
    description: >
      copy each found directory's component subdirectories into
      `<dir>/.lydite-reports` before the command runs
    required: false
    default: "true"
  command:
    description: >
      the lydite subcommand words to run, space-separated, e.g. `test merge`
    required: true
  extra-args:
    description: additional space-separated flags, appended after the `--reports` args
    required: false
    default: ""
  error-message:
    description: the `::error::` message printed when no report directory is found
    required: true
  upload-reports:
    description: upload the folded .lydite-reports as an artifact for a later `publish`
    required: false
    default: "true"
  artifact-name:
    description: which section of the comment these reports become
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Every value reaches the script through env. Interpolating `${{ }}` into a
    # run body is a script-injection vector.
    #
    # `COMMAND` and `EXTRA_ARGS` are word-split deliberately: a caller writes
    # them as a literal in its own `with:` block, so the words are the
    # interface, not text arriving from a fork.
    - shell: bash
      env:
        DIR: ${{ inputs.dir }}
        REPORTS: ${{ inputs.reports }}
        DOC_NAMES: ${{ inputs.doc-names }}
        COPY_COMPONENTS: ${{ inputs.copy-components }}
        COMMAND: ${{ inputs.command }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        ERROR_MESSAGE: ${{ inputs.error-message }}
      run: |
        set -euo pipefail
        shopt -s nullglob

        # Found by the documents rather than by the directory layout, because
        # the layout is not ours to predict: actions/download-artifact gives an
        # artifact its own subdirectory only when the pattern matched more than
        # one, and extracts a lone match straight into `path`. A repository
        # planning one shard, or one scan job, therefore leaves its document
        # directly under ${REPORTS}, where a `*/` glob never looks — it finds
        # that shard's per-component log directories instead and folds one of
        # those, recording nothing while staying green saying so. Depth 2
        # reaches both shapes and stops above the per-component directories,
        # which hold logs and coverage reports rather than any document.
        #
        # `merge-multiple: true` on the download that produced ${REPORTS} is
        # not the fix: it puts every shard's `measurements.json` at one path,
        # and the per-shard separation it collapses is what completeness is
        # decided from.
        read -r -a doc_names <<< "${DOC_NAMES}"
        find_names=()
        for name in "${doc_names[@]}"; do
          if [ "${#find_names[@]}" -gt 0 ]; then
            find_names+=(-o)
          fi
          find_names+=(-name "${name}")
        done

        args=()
        dirs=()
        while IFS= read -r dir; do
          args+=(--reports "${dir}")
          dirs+=("${dir}")
        done < <(find "${REPORTS%/}" -maxdepth 2 \
                   \( "${find_names[@]}" \) \
                   -exec dirname {} \; | sort -u)
        if [ "${#dirs[@]}" -eq 0 ]; then
          echo "::error::${ERROR_MESSAGE}"
          exit 1
        fi

        # Named out loud: a fold reading a directory nobody meant it to folds
        # something and says nothing, and what tells that apart from a fold
        # that read the right one is which paths were there to be read.
        printf 'folding %s\n' "${dirs[@]}"

        # Each shard's component subdirectories are copied in first. The folded
        # rows carry the shards' own `log` paths, and `publish` resolves those
        # against the directory it is given — this one. Without the copy a red
        # component's row in the comment names a log that is in an artifact
        # `publish` deliberately never downloads, and carries no tail at all.
        # A fold nothing publishes needs no copy.
        #
        # The component subdirectories of each shard that was found, rather
        # than a glob of a fixed depth: a lone shard's sit directly under
        # ${REPORTS}, and every other shard's one level below that.
        out="${DIR%/}/.lydite-reports"
        if [ "${COPY_COMPONENTS}" = "true" ]; then
          mkdir -p "${out}"
          for dir in "${dirs[@]}"; do
            for logs in "${dir}"/*/; do
              cp -R "${logs}" "${out}/"
            done
          done
        fi

        # The verdict over the whole repository is this step's, so the exit code
        # is re-raised rather than only reported. The upload below runs on
        # `always()`, so a failing fold still reaches the comment.
        read -r -a command_words <<< "${COMMAND}"
        read -r -a extra_args <<< "${EXTRA_ARGS}"
        status=0
        lydite "${command_words[@]}" --dir "${DIR}" "${args[@]}" "${extra_args[@]}" || status=$?
        echo "lydite ${COMMAND} exited ${status}"
        exit "${status}"

    - id: reports
      if: ${{ always() && inputs.upload-reports == 'true' }}
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: |
        path="${DIR%/}/.lydite-reports"
        if [ -d "${path}" ]; then
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
        else
          echo "no ${path}: this job wrote no report" >&2
        fi

    - if: ${{ always() && steps.reports.outputs.path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lydite-reports-${{ inputs.artifact-name }}
        path: ${{ steps.reports.outputs.path }}
        retention-days: 7
        include-hidden-files: true
