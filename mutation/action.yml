# Mutates the components this job is responsible for, and uploads the reports.
#
# It assumes lydite is already on PATH — `lydite/actions/setup` puts it there.
#
# Two inputs decide what this actually runs, and neither is inferred:
#
#   - `affected` runs only the components a change could have broken. A
#     component the change does not touch costs nothing — no baseline suite, no
#     compose stack — because half of what bounds a mutant is knowable from the
#     diff alone.
#   - `component` says which components this job is *responsible for*, which is
#     what lets a matrix of jobs each hold one shard.
#
# lydite infers neither. Every signal for "is this a pull request" is unreliable
# where it runs — a detached HEAD, a shallow clone, a fork with no upstream —
# and the workflow already knows the event; and no run can guess which slice of
# a matrix it is.
#
# `component` and `affected` compose rather than substituting for each other:
# `component` narrows what this job answers about, `affected` narrows which of
# those actually run, and a component in the slice that selection skipped is
# still reported — one row. A job reports nothing at all about a component
# outside its slice, which is what lets `lydite/actions/mutation-merge` decide
# completeness from the declaration and the documents alone.
#
# The run always streams. A mutation run prints nothing for as long as it takes:
# every mutant's line goes to the component's log, and that log reaches a reader
# through the artifact this action uploads on its way out. A job that is killed
# never gets there, so the whole run is lost and nothing says how far it had
# come — which is the case `--stream` exists for. A suite's own log stays
# captured under `lydite/actions/test`, where thousands of passing lines would
# bury the one component that failed.
#
# Mutation is diff-scoped always: mutants come from the change against the
# merge-base, so the caller's checkout has to be `fetch-depth: 0`. lydite
# refuses rather than mutating the repository.
#
# `base-sha` names the other end of that diff outright, for a run that has no
# merge-base to resolve: after a merge HEAD is its own merge-base, and `HEAD~1`
# is the merge commit's own contribution. `no-gate` belongs with it — there a
# survivor is history rather than a verdict, because the branch that could fix
# it is gone, so a completed measurement is recorded without voting on the
# step's exit code while a not-runnable component or an unresolvable base still
# fails the job. A pull request passes neither: its gate is the point.
#
# A retried job resumes. lydite records every verdict it reaches under
# `state-dir`, and a rerun measures only the mutants it has no verdict for. The
# state is a cache, never a ledger: everything in it is reproducible by running
# the suite again, so a state that cannot be read or written is a diagnostic in
# the log and never a failed run.
#
# The state lives in its own cache entry, outside ~/.cache/lydite. That cache is
# keyed on the pin manifests, and a cache key is immutable — a hit is never saved
# over — so verdicts written there on one attempt would never reach the next.
# It lives outside the checkout too, so no suite or scanner walks it, and never
# under .lydite-reports, whose contents are the artifact `publish` reads.
#
# The key is `lydite-mutation-<os>-<shard>-<sha>-<run_attempt>`. `run_attempt`
# makes every attempt's key its own, so a retry has a key nothing has saved yet
# and can write the verdicts it adds; the restore prefix stops before it, so a
# retry restores the newest entry any earlier attempt at the same commit saved.
# `<shard>` is `artifact-name`, which names this job's slice of a matrix;
# `component` is a comma list and does not make a key. `<sha>` is `github.sha`,
# which on a pull_request run is the synthetic merge commit: a new push, or a
# base that moved, is a different commit and deliberately restores nothing,
# because a verdict holds only for the tree it was measured against.
#
# `deadline` bounds the run from lydite's own start. A run that reaches it exits
# 3 having kept every verdict it reached, the step fails the job as any other
# incomplete run does, and the save step runs regardless under `always()` — so
# the retry that follows picks up where this attempt stopped.
#
# Both flags are passed only when `lydite mutation --help` lists them, so a
# lydite pinned below them runs exactly as it would without this state; the
# cache steps are skipped when `--state-dir` is not supported.
name: lydite mutation
description: Mutate each component under lydite and upload the reports

inputs:
  dir:
    description: the scan root, relative to the workspace
    required: false
    default: "."
  affected:
    description: run only the components this change could have broken
    required: false
    default: "false"
  component:
    description: >
      comma-separated components this job is responsible for; empty makes it
      responsible for every declared one. A shard matrix passes its own slice.
    required: false
    default: ""
  base-branch:
    description: >
      the branch a merge-base is resolved against. Pass `github.base_ref` on a
      pull request; empty lets lydite discover the default branch.
    required: false
    default: ""
  base-sha:
    description: >
      a revision the diff is taken against instead of a merge-base, resolved
      with `git rev-parse --verify` and never fetched. A post-merge run passes
      `HEAD~1`; empty leaves lydite resolving a merge-base.
    required: false
    default: ""
  no-gate:
    description: >
      let a completed measurement finish without a survivor voting on the step's
      exit code. A post-merge run passes `true`; a pull request never does.
    required: false
    default: "false"
  concurrency:
    description: how many components may run at once; empty keeps lydite's own default
    required: false
    default: ""
  cache:
    description: >
      cache ~/.cache/lydite, where every pinned runner, scanner and language
      toolchain lydite installs lands
    required: false
    default: "true"
  upload-reports:
    description: upload .lydite-reports as an artifact for a later `publish`
    required: false
    default: "true"
  artifact-name:
    description: which job's reports these are; becomes the artifact suffix
    required: false
    default: mutation
  artifact-prefix:
    description: >
      what the artifact is called before the suffix. A shard's document is an
      input to `lydite/actions/mutation-merge`, not a section of the comment, so
      a matrix passes `lydite-mutation-shard`: `publish` reads
      `lydite-reports-*`, and would otherwise render one `mutation` section per
      shard, each answering about part of the repository under one heading.
    required: false
    default: lydite-reports
  state-dir:
    description: >
      where lydite keeps the verdicts a retried job resumes from; empty resolves
      to `$RUNNER_TEMP/lydite-mutation-state`. Refused inside the workspace or
      ~/.cache/lydite.
    required: false
    default: ""
  deadline:
    description: >
      how long lydite may run before it stops and keeps the verdicts it reached,
      as a Go duration (`45m`); empty sets none. A run that reaches it exits 3.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Keyed on the pin manifests, so a Dependabot bump misses and installs what
    # it just pinned. The globs are lydite's own layout for a consumer that
    # vendors nothing, plus whatever the repository's own declaration names.
    - if: ${{ inputs.cache == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/lydite
        key: lydite-${{ runner.os }}-${{ hashFiles('**/.lydite/components.yml', '**/rust-toolchain.toml', '**/package-lock.json', '**/go.sum') }}
        restore-keys: lydite-${{ runner.os }}-

    # Every value reaches a script through env. Interpolating `${{ }}` into a
    # run body is a script-injection vector.
    #
    # Resolves where the mutation state lives, the shard its cache key names,
    # and which of the state flags the lydite on PATH understands. The help text
    # is captured before it is searched: `grep -q` exits at its first match, and
    # under pipefail the writer it leaves behind would fail the pipeline.
    - id: state
      shell: bash
      env:
        STATE_DIR_INPUT: ${{ inputs.state-dir }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail
        dir="${STATE_DIR_INPUT:-${RUNNER_TEMP}/lydite-mutation-state}"
        case "${dir}" in
          /*) ;;
          *) dir="${GITHUB_WORKSPACE}/${dir}" ;;
        esac
        dir="${dir%/}"
        case "/${dir}/" in
          */.lydite-reports/*)
            echo "::error::state-dir ${dir} is under .lydite-reports, which is the reports artifact" >&2
            exit 1 ;;
        esac
        case "${dir}/" in
          "${GITHUB_WORKSPACE%/}/"*)
            echo "::error::state-dir ${dir} is inside the workspace; name a directory outside the checkout" >&2
            exit 1 ;;
          "${HOME%/}/.cache/lydite/"*)
            echo "::error::state-dir ${dir} is inside ~/.cache/lydite, whose cache key never takes a new save" >&2
            exit 1 ;;
        esac
        mkdir -p "${dir}"
        shard="$(printf '%s' "${ARTIFACT_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
        help="$(lydite mutation --help 2>&1 || true)"
        state_dir=false
        deadline=false
        if grep -q -- '--state-dir' <<<"${help}"; then
          state_dir=true
        fi
        if grep -q -- '--deadline' <<<"${help}"; then
          deadline=true
        fi
        if [ "${state_dir}" != "true" ]; then
          echo "the lydite on PATH has no --state-dir; a retry of this job measures every mutant again" >&2
        fi
        {
          echo "dir=${dir}"
          echo "shard=${shard}"
          echo "supported=${state_dir}"
          echo "deadline-supported=${deadline}"
        } >> "${GITHUB_OUTPUT}"

    - if: ${{ steps.state.outputs.supported == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.state.outputs.dir }}
        key: lydite-mutation-${{ runner.os }}-${{ steps.state.outputs.shard }}-${{ github.sha }}-${{ github.run_attempt }}
        restore-keys: lydite-mutation-${{ runner.os }}-${{ steps.state.outputs.shard }}-${{ github.sha }}-

    - shell: bash
      env:
        DIR: ${{ inputs.dir }}
        AFFECTED: ${{ inputs.affected }}
        COMPONENT: ${{ inputs.component }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        BASE_SHA: ${{ inputs.base-sha }}
        NO_GATE: ${{ inputs.no-gate }}
        CONCURRENCY: ${{ inputs.concurrency }}
        STATE_DIR: ${{ steps.state.outputs.dir }}
        STATE_SUPPORTED: ${{ steps.state.outputs.supported }}
        DEADLINE: ${{ inputs.deadline }}
        DEADLINE_SUPPORTED: ${{ steps.state.outputs.deadline-supported }}
      run: |
        set -euo pipefail
        args=(mutation --dir "${DIR}")
        if [ "${AFFECTED}" = "true" ]; then
          args+=(--affected)
        fi
        if [ -n "${COMPONENT}" ]; then
          args+=(--component "${COMPONENT}")
        fi
        if [ -n "${BASE_BRANCH}" ]; then
          args+=(--base-branch "${BASE_BRANCH}")
        fi
        if [ -n "${BASE_SHA}" ]; then
          args+=(--base-sha "${BASE_SHA}")
        fi
        if [ -n "${CONCURRENCY}" ]; then
          args+=(--concurrency "${CONCURRENCY}")
        fi
        args+=(--stream)
        if [ "${NO_GATE}" = "true" ]; then
          args+=(--no-gate)
        fi
        if [ "${STATE_SUPPORTED}" = "true" ]; then
          args+=(--state-dir "${STATE_DIR}")
        fi
        if [ -n "${DEADLINE}" ]; then
          if [ "${DEADLINE_SUPPORTED}" = "true" ]; then
            args+=(--deadline "${DEADLINE}")
          else
            echo "::warning::the lydite on PATH has no --deadline; this run is bounded by the job's own timeout alone"
          fi
        fi
        lydite "${args[@]}"

    # Saves whatever verdicts this attempt reached, including when the run
    # failed or stopped at its deadline. The key carries `run_attempt`, so it is
    # one nothing has saved under yet.
    - if: ${{ always() && steps.state.outputs.supported == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.state.outputs.dir }}
        key: lydite-mutation-${{ runner.os }}-${{ steps.state.outputs.shard }}-${{ github.sha }}-${{ github.run_attempt }}

    - id: reports
      if: ${{ always() && inputs.upload-reports == 'true' }}
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: |
        path="${DIR%/}/.lydite-reports"
        if [ -d "${path}" ]; then
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
        else
          echo "no ${path}: this job wrote no report" >&2
        fi

    - if: ${{ always() && steps.reports.outputs.path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-prefix }}-${{ inputs.artifact-name }}
        path: ${{ steps.reports.outputs.path }}
        retention-days: 7
        include-hidden-files: true
