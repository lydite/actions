# Folds a shard matrix's mutation documents back into one, and uploads the
# result as the `mutation` section of the comment.
#
# It assumes lydite is already on PATH — `lydite/actions/setup` puts it there.
#
# This is the completeness check, and it is the reason the shards may each report
# only what they own. Every declared component takes exactly one row across the
# matrix, so a component with no row is a shard whose job died and a component
# with two is two jobs running the same work — both failures, and neither is
# `unmeasured`, which does not vote and would publish a passing verdict over a
# repository half of which was never mutated.
#
# Unlike the test fold it computes no figure over the repository: there is none
# to compute, since survived == 0 for every component is survived == 0 for the
# repository. What it adds to the shards' rows is the summary row.
#
# It needs a checkout, because completeness is a question about the declaration
# and the declaration is read from the tree.
name: lydite mutation merge
description: Fold every shard's lydite mutation report into one, and upload it for a later publish

inputs:
  dir:
    description: the scan root, relative to the workspace
    required: false
    default: "."
  reports:
    description: >
      directory holding one subdirectory per shard's uploaded reports, as
      `actions/download-artifact` with a `lydite-mutation-shard-*` pattern
      produces
    required: false
    default: shards
  upload-reports:
    description: upload the folded .lydite-reports as an artifact for a later `publish`
    required: false
    default: "true"
  artifact-name:
    description: which section of the comment these reports become
    required: false
    default: mutation

runs:
  using: composite
  steps:
    # The finding, the reporting and the exit status are the shared fold's;
    # what is this action's is which documents mark a report directory, which
    # command reads them, and that the folded reports become a comment section.
    #
    # The shared fold is a script reached through `github.action_path`, never a
    # nested `uses:`: a composite-action reference carries its own ref, which
    # GitHub resolves independently of the ref a consumer pinned this action to.
    # `${ACTION_PATH}` is this directory inside the checkout that resolved this
    # action, so the script is always the consumer's own ref.
    #
    # Every value reaches the script through env. Interpolating `${{ }}` into a
    # run body is a script-injection vector.
    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DIR: ${{ inputs.dir }}
        REPORTS: ${{ inputs.reports }}
        DOC_NAMES: mutation.json
        COPY_COMPONENTS: "true"
        COMMAND: mutation merge
        ERROR_MESSAGE: "no shard uploaded a report directory under ${{ inputs.reports }}; there is nothing to fold"
      run: bash "${ACTION_PATH}/../.github/actions/fold/fold.sh"

    - id: reports
      if: ${{ always() && inputs.upload-reports == 'true' }}
      shell: bash
      env:
        DIR: ${{ inputs.dir }}
      run: |
        path="${DIR%/}/.lydite-reports"
        if [ -d "${path}" ]; then
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
        else
          echo "no ${path}: this job wrote no report" >&2
        fi

    - if: ${{ always() && steps.reports.outputs.path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: lydite-reports-${{ inputs.artifact-name }}
        path: ${{ steps.reports.outputs.path }}
        retention-days: 7
        include-hidden-files: true
